services:

  nginx:
    image: nginx:1.27-alpine
    container_name: madlan-nginx
    restart: unless-stopped
    ports:
      - "80:80"   # HTTPS is added on the server (see documentation/WORK_PLAN.md, deployment)
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - client
      - api
    networks:
      - madlan_network

  client:
    build: ./client
    container_name: madlan-client
    command: serve -s dist/browser -l 4200   # -s: every unknown path returns index.html (Angular routing)
    restart: unless-stopped
    networks:
      - madlan_network

  api:
    build: ./api
    container_name: madlan-api
    command: npm run start
    restart: unless-stopped
    env_file:
      - ./api/.env           # ANTHROPIC_API_KEY and settings; never committed
    environment:
      - PORT=3000
      - MONGO_URI=mongodb://mongo:27017/madlan
      - NODE_ENV=production
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - madlan_network

  # One-off: clean the CSV and load it into Mongo. Run with: docker compose run --rm seed
  seed:
    build: ./api
    container_name: madlan-seed
    command: npm run seed
    volumes:
      - ./api/data:/usr/src/app/data   # raw CSV in, seed_report.json out
    environment:
      - MONGO_URI=mongodb://mongo:27017/madlan
    depends_on:
      mongo:
        condition: service_healthy
    profiles:
      - tools
    networks:
      - madlan_network

  mongo:
    image: mongo:7
    container_name: madlan-mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - madlan_network

networks:
  madlan_network:

volumes:
  mongo_data:

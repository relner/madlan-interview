server {
  listen 80;

  server_name _;

  # Docker's DNS: resolve container names on each request, so rebuilding api/client
  # (new container IP) never leaves nginx pointing at a dead address
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $client_upstream http://client:4200;
  set $api_upstream http://api:3000;

  # Requests to the assistant are small; reject anything large early
  client_max_body_size 32k;

  location / {
    proxy_pass $client_upstream;
  }

  location /api {
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # The API has its own model timeouts (8s parse, 20s explain); this only guards against a stuck upstream
    proxy_read_timeout 30s;
  }
}
